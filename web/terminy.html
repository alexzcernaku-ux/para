<script>

    supabaseAnonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpYnl0eW1uemdsdXl4eHN6cmlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MzM4ODgsImV4cCI6MjEwMTAwOTg4OH0.hFEzCTPZEGpQaQguytnu8Hyz6z9j6P5M1E17l2WfGdE",
  };
</script>
<script type="module">
  import { requireOnboardedProfile, signOut } from "./assets/js/supabase-client.js";
  import { computeDeadlines, urgencyLevel } from "./assets/js/deadlines.js";

  const loadingEl = document.getElementById("page-loading");
  const shellEl = document.getElementById("page-shell");
  const container = document.getElementById("timeline-container");
  const signoutBtn = document.getElementById("signout-btn");

  const MESICE = ["leden", "únor", "březen", "duben", "květen", "červen", "červenec", "srpen", "září", "říjen", "listopad", "prosinec"];
  // slice(0,3) by dal "čer" pro červen i červenec zároveň — vlastní zkratky.
  const MESICE_ZKRATKA = ["led", "úno", "bře", "dub", "kvě", "čvn", "čvc", "srp", "zář", "říj", "lis", "pro"];

  function renderTimeline(items) {
    if (!items.length) {
      container.innerHTML = `
        <div class="terminy-empty">
          <img src="assets/img/mascot/mascot-ma-vas-rad.png" alt="" />
          <h3>Žádné termíny na dohled</h3>
          <p>V nejbližších měsících vás nečeká žádná povinnost, kterou umíme spočítat.</p>
        </div>`;
      return;
    }

    let html = "";
    let lastMonthKey = null;
    for (const item of items) {
      const monthKey = `${item.date.getFullYear()}-${item.date.getMonth()}`;
      if (monthKey !== lastMonthKey) {
        html += `<div class="timeline-month-label">${MESICE[item.date.getMonth()]} ${item.date.getFullYear()}</div>`;
        lastMonthKey = monthKey;
      }
      const level = urgencyLevel(item.zbyvaDni);
      const countdownText = item.zbyvaDni <= 0 ? "Dnes" : item.zbyvaDni === 1 ? "Zítra" : `Za ${item.zbyvaDni} dní`;
      html += `
        <div class="timeline-item ${level}">
          <div class="timeline-date">
            <div class="day">${item.date.getDate()}.</div>
            <div class="mon">${MESICE_ZKRATKA[item.date.getMonth()]}</div>
          </div>
          <div class="timeline-body">
            <div class="timeline-body-top">
              <div class="timeline-title">${item.title}</div>
              <span class="timeline-countdown ${level}">${countdownText}</span>
            </div>
            <p class="timeline-desc">${item.popis}</p>
            <div class="timeline-source">${item.zdroj}</div>
          </div>
        </div>`;
    }
    container.innerHTML = html;
  }

  signoutBtn.addEventListener("click", () => signOut());

  (async () => {
    const result = await requireOnboardedProfile();
    if (!result) return;
    const { profile } = result;

    renderTimeline(computeDeadlines(profile));

    loadingEl.classList.add("hidden");
    shellEl.classList.remove("hidden");
  })();
</script>

</body>
</html>
